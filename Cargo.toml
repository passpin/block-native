[package]
name = "block-native"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Keyboard-first block/text editor, compiler, and native runtime"

[lib]
name = "block_native"
path = "src/lib.rs"

[[bin]]
name = "blockc"
path = "src/bin/blockc.rs"

[[bin]]
name = "blockrun"
path = "src/bin/blockrun.rs"

[dependencies]
macroquad = { version = "0.4.14", features = ["audio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.13"
